<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" fill="none">
  <defs>
    <!-- Deep Space Gradient Background -->
    <linearGradient id="splashBg" x1="540" y1="0" x2="540" y2="1920" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0F1F"/>
      <stop offset="50%" stop-color="#070A16"/>
      <stop offset="100%" stop-color="#05070F"/>
    </linearGradient>

    <!-- Radial Glow behind central logo -->
    <radialGradient id="centerCyanGlow" cx="540" cy="900" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0F1F" stop-opacity="0"/>
    </radialGradient>

    <!-- Main N Glow Filter -->
    <filter id="splashNeonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00ffff" flood-opacity="1" />
      <feDropShadow dx="0" dy="0" stdDeviation="36" flood-color="#38bdf8" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="70" flood-color="#a855f7" flood-opacity="0.35" />
    </filter>

    <linearGradient id="splashCircuitGrad" x1="10" y1="9" x2="30" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="splashWordmarkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="splashInnerNDark" x1="10" y1="9" x2="30" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1529" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#070a14" stop-opacity="0.98" />
    </linearGradient>
  </defs>

  <!-- 1. Background Fill #0A0F1F -->
  <rect width="1080" height="1920" fill="url(#splashBg)"/>

  <!-- 2. Ambient Neural Glow -->
  <circle cx="540" cy="900" r="420" fill="url(#centerCyanGlow)"/>

  <!-- 3. Ambient Synapse Network Grid Lines -->
  <g opacity="0.18">
    <line x1="200" y1="700" x2="540" y2="900" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="6 6"/>
    <line x1="880" y1="700" x2="540" y2="900" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 6"/>
    <line x1="200" y1="1100" x2="540" y2="900" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="6 6"/>
    <line x1="880" y1="1100" x2="540" y2="900" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="200" cy="700" r="4" fill="#00ffff"/>
    <circle cx="880" cy="700" r="4" fill="#a855f7"/>
    <circle cx="200" cy="1100" r="4" fill="#00ffff"/>
    <circle cx="880" cy="1100" r="4" fill="#a855f7"/>
  </g>

  <!-- 4. Centered Glowing N Logo (scaled 6.5x from 40x40 = 260x260, centered at 540, 900) -->
  <g transform="translate(410, 770) scale(6.5)">
    <!-- Rounded Square Container -->
    <rect x="0.5" y="0.5" width="39" height="39" rx="10" fill="#0A0F1F" stroke="#00ffff" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Large Letter N in Center with Neon Cyan Stroke #00ffff and Glow -->
    <path
      d="M 10 31 L 10 9 L 15 9 L 25 24 L 25 9 L 30 9 L 30 31 L 25 31 L 15 16 L 15 31 Z"
      fill="url(#splashInnerNDark)"
      stroke="#00ffff"
      stroke-width="1.6"
      stroke-linejoin="round"
      filter="url(#splashNeonGlow)"
    />

    <!-- Small Brain Icon at Top Left of N -->
    <g id="miniBrainIcon" opacity="0.95">
      <path
        d="M 12.5 10.5 C 11.2 10.5 10.8 11.4 10.8 12.2 C 10.8 13.0 11.4 13.5 12.3 13.6 C 11.4 13.9 11.0 14.5 11.2 15.2 C 11.4 15.8 12.0 16.2 12.8 16.0"
        fill="none"
        stroke="#00ffff"
        stroke-width="0.8"
        stroke-linecap="round"
      />
      <path
        d="M 12.7 10.5 C 13.8 10.5 14.3 11.4 14.2 12.2 C 14.2 13.0 13.6 13.5 12.7 13.6 C 13.6 13.9 14.0 14.5 13.8 15.2 C 13.6 15.8 13.0 16.2 12.4 16.0"
        fill="none"
        stroke="#00ffff"
        stroke-width="0.8"
        stroke-linecap="round"
      />
      <circle cx="12.5" cy="11.8" r="0.75" fill="#00ffff" />
      <circle cx="11.6" cy="14.2" r="0.6" fill="#38bdf8" />
      <circle cx="13.4" cy="14.2" r="0.6" fill="#a855f7" />
      <line x1="12.5" y1="11.8" x2="11.6" y2="14.2" stroke="#00ffff" stroke-width="0.5" stroke-opacity="0.8" />
      <line x1="12.5" y1="11.8" x2="13.4" y2="14.2" stroke="#00ffff" stroke-width="0.5" stroke-opacity="0.8" />
    </g>

    <!-- Circuit Lines & Board Traces Inside N -->
    <g id="circuitBoardTraces" opacity="0.85">
      <path
        d="M 12.6 16.5 V 22 L 11.2 23.5 V 27 L 12.5 28.5 V 30"
        fill="none"
        stroke="url(#splashCircuitGrad)"
        stroke-width="0.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M 12.6 20 H 14.2"
        fill="none"
        stroke="#00ffff"
        stroke-width="0.75"
        stroke-linecap="round"
      />
      <path
        d="M 16 13.5 L 20 19.5 L 23.5 24.5"
        fill="none"
        stroke="#00ffff"
        stroke-width="0.85"
        stroke-dasharray="2.5 1"
        stroke-linecap="round"
      />
      <path
        d="M 18.2 16.8 L 19.8 15.5 H 22"
        fill="none"
        stroke="#38bdf8"
        stroke-width="0.7"
        stroke-linecap="round"
      />
      <path
        d="M 27.5 10.5 V 15.5 L 28.8 17 V 23.5 L 27.5 25 V 29.5"
        fill="none"
        stroke="url(#splashCircuitGrad)"
        stroke-width="0.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M 27.5 13.5 H 25.8"
        fill="none"
        stroke="#00ffff"
        stroke-width="0.75"
        stroke-linecap="round"
      />
      <path
        d="M 27.5 21 H 29"
        fill="none"
        stroke="#a855f7"
        stroke-width="0.75"
        stroke-linecap="round"
      />
    </g>

    <!-- Small Dots (Circuit Board Pads / Synapse Terminals) Inside N -->
    <g id="circuitDots">
      <circle cx="14.2" cy="20" r="0.8" fill="#00ffff" />
      <circle cx="12.5" cy="30" r="0.8" fill="#00ffff" />
      <circle cx="11.2" cy="27" r="0.65" fill="#38bdf8" />
      <circle cx="22" cy="15.5" r="0.75" fill="#00ffff" />
      <circle cx="20" cy="19.5" r="0.8" fill="#38bdf8" />
      <circle cx="23.5" cy="24.5" r="0.8" fill="#a855f7" />
      <circle cx="25.8" cy="13.5" r="0.8" fill="#00ffff" />
      <circle cx="28.8" cy="17" r="0.65" fill="#38bdf8" />
      <circle cx="29" cy="21" r="0.75" fill="#a855f7" />
      <circle cx="27.5" cy="29.5" r="0.8" fill="#00ffff" />
    </g>
  </g>

  <!-- 5. Brand Wordmark & Tagline -->
  <text x="540" y="1120" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="52" letter-spacing="8" fill="url(#splashWordmarkGrad)">
    NEXOVIAN
  </text>
  <text x="540" y="1175" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="20" letter-spacing="2" fill="#00ffff" opacity="0.85">
    The Learning Brain That Grows With You
  </text>
</svg>
