  <body class="bg-[#0F0F0F] text-[#F8FAFC] antialiased selection:bg-[#FACC15]/25 selection:text-[#FACC15] min-h-screen max-w-[100vw] overflow-x-hidden w-full">
    <div id="root">
      <!-- Instant pre-hydration splash screen on dark #0F0F0F with glowing yellow N centered -->
      <div style="position:fixed;inset:0;background-color:#0F0F0F;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
        <div style="position:relative;width:96px;height:96px;border-radius:24px;background-color:#0F0F0F;border:1px solid rgba(250,204,21,0.6);display:flex;align-items:center;justify-content:center;box-shadow:0 0 35px rgba(250,204,21,0.4);">
          <img src="/favicon.svg" alt="NEXOVIAN" style="width:72px;height:72px;" />
        </div>
        <div style="margin-top:20px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:22px;letter-spacing:4px;color:#FACC15;">
          NEXOVIAN
        </div>
        <div style="margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(250,204,21,0.85);letter-spacing:1px;">
          The Learning Brain That Grows With You
        </div>
      </div>
    </div>
    
    <!-- PART B: PWA INSTALL POPUP EVERY VISIT -->
    <div id="installPopup" style="display:none; position:fixed; bottom:20px; left:5%; right:5%; background:#000; color:#fff; padding:20px; border-radius:16px; z-index:9999; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.5); border:1px solid #333;">
      <p style="margin:0 0 8px; font-weight:bold;">📲 Install NEXOVIAN App</p>
      <p style="margin:0 0 15px; font-size:13px; color:#ccc;">Learn offline in 11 Languages - Grade 4 to University</p>
      <button id="installBtn" style="background:#FFD700; color:#000; padding:12px 25px; border-radius:10px; font-weight:bold; border:none; margin-right:10px; cursor:pointer;">Install Now</button>
      <button onclick="document.getElementById('installPopup').style.display='none'" style="background:transparent; color:#fff; border:1px solid #555; padding:12px 20px; border-radius:10px; cursor:pointer;">Later</button>
    </div>
    
    <script>
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        setTimeout(() => {
          const el = document.getElementById('installPopup');
          if (el) el.style.display = 'block';
        }, 2500);
      });
      
      document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('installBtn');
        if (btn) {
          btn.addEventListener('click', async () => {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              await deferredPrompt.userChoice;
              deferredPrompt = null;
              const el = document.getElementById('installPopup');
              if (el) el.style.display = 'none';
            } else {
              const el = document.getElementById('installPopup');
              if (el) {
                el.innerHTML = '<p style="margin:0 0 10px; font-weight:bold;">📲 How to Install</p><p style="font-size:13px; color:#ddd; margin:0 0 15px;">Android: Tap ⋮ > Install App<br>iPhone: Share > Add to Home Screen</p><button onclick="document.getElementById(\'installPopup\').style.display=\'none\'" style="background:#FFD700; color:#000; padding:8px 20px; border-radius:8px; font-weight:bold; border:none; cursor:pointer;">Got it</button>';
              }
            }
          });
        }
      });
      
      if (!('BeforeInstallPromptEvent' in window)) {
        setTimeout(() => {
          const el = document.getElementById('installPopup');
          if (el) el.style.display = 'block';
        }, 3000);
      }

      // Service Worker registration for offline mode
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
